<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metronome</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap">
  <link rel="stylesheet" href="src/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem('metronome-theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch {}
  </script>
</head>
<body>
  <!-- Yandex.Metrika counter -->
  <script type="text/javascript">
      (function(m,e,t,r,i,k,a){
          m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
          m[i].l=1*new Date();
          for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
          k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
      })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=113264730', 'ym');

      ym(113264730, 'init', {ssr:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/113264730" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <!-- /Yandex.Metrika counter -->
  <header class="header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 21h8l-3-17h-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 18 17 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span data-i18n="title">Metronome</span>
    </div>
    <div class="header-actions">
      <div class="segmented" id="lang" role="group" aria-label="Language">
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="icon-btn" id="fullscreen" data-i18n-aria="fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme" data-i18n-aria="theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="app">
    <section class="card stage">
      <div class="segmented display-toggle" id="display" role="group" data-i18n-aria="display">
        <button data-view="digital" data-i18n="digital">Digital</button>
        <button data-view="pendulum" data-i18n="pendulum">Pendulum</button>
      </div>

      <svg id="pendulum" class="pendulum" viewBox="0 0 200 230" aria-hidden="true">
        <path class="pendulum-body" d="M52 222h96L122 18H78z"/>
        <path class="pendulum-scale" d="M88 40h24M88 60h24M88 80h24M88 100h24M88 120h24M88 140h24M88 160h24"/>
        <g id="pendulum-arm">
          <line class="pendulum-rod" x1="100" y1="196" x2="100" y2="8"/>
          <rect id="pendulum-weight" class="pendulum-weight" x="88" y="60" width="24" height="18" rx="4"/>
        </g>
        <circle class="pendulum-pivot" cx="100" cy="196" r="6"/>
      </svg>

      <div class="tempo">
        <button class="round" id="bpm-down" data-i18n-aria="slower" aria-label="Slower">−</button>
        <div class="bpm-readout">
          <input id="bpm" type="number" min="30" max="300" value="120" inputmode="numeric" data-i18n-aria="tempo" aria-label="Tempo">
          <div class="meta">
            <span data-i18n="bpm">BPM</span> · <span id="marking">Allegro</span> · <span id="signature">4/4</span>
          </div>
        </div>
        <button class="round" id="bpm-up" data-i18n-aria="faster" aria-label="Faster">+</button>
      </div>

      <input type="range" id="bpm-slider" min="30" max="300" value="120" data-i18n-aria="tempo" aria-label="Tempo">

      <div id="beats" class="beats"></div>
      <p class="beats-hint" data-i18n="beatsHint"></p>
      <label class="check">
        <input type="checkbox" id="stress-first">
        <span data-i18n="stressFirst">Stress first beat</span>
      </label>
      <p class="remaining" id="remaining" role="timer" hidden>0:00</p>

      <div class="actions">
        <button id="play" class="btn btn--primary btn--lg" data-i18n="start">Start</button>
        <button id="tap" class="btn btn--secondary btn--lg" data-i18n="tap">Tap</button>
        <button id="reset" class="btn btn--ghost btn--lg" data-i18n="reset">Reset</button>
      </div>
    </section>

    <section class="card settings">
      <div class="field"><span class="field-label" data-i18n="timeSignature">Time signature</span>
        <span class="signature-pick">
          <div id="beats-per-bar"></div>
          <span>/</span>
          <div id="note-value"></div>
        </span>
      </div>
      <div class="field"><span class="field-label" data-i18n="sound">Sound</span>
        <div id="sound"></div>
      </div>
      <div class="field"><span class="field-label" data-i18n="pitch">Pitch</span>
        <div id="pitch"></div>
      </div>
      <div class="field"><span class="field-label" data-i18n="timer">Practice timer</span>
        <div id="timer"></div>
      </div>
      <div class="field wide"><span class="field-label" data-i18n="subdivision">Rhythm</span>
        <div id="subdivision" class="rhythm-grid" role="radiogroup" data-i18n-aria="subdivision"></div>
      </div>
      <div class="field wide"><span class="field-label" data-i18n="volume">Volume</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" data-i18n-aria="volume" aria-label="Volume">
      </div>
    </section>

    <p class="hint">
      <kbd>Space</kbd> <kbd>↑</kbd><kbd>↓</kbd> <kbd>T</kbd> — <span data-i18n="keys"></span>
    </p>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
