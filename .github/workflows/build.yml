name: build

on:
  push:
    branches-ignore:
      - main
      - master
    tags:
      - '*'

permissions:
  contents: read

jobs:
  Web:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: metronom-site
          path: dist/site/
          if-no-files-found: error
          retention-days: 1
  Build:
    needs: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: metronom-site
          path: dist/site
      - name: Install Exordos CLI
        run: |
          curl -fsSL https://repo.exordos.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build element
        id: build
        run: |
          exordos --no-check-updates build -f "$(pwd)"
          echo "version=$(exordos --no-check-updates get-version .)" >> "$GITHUB_OUTPUT"
      - name: Publish element
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          set -eu
          test -n "$PUSH_CFG"
          trap 'rm -f exordos/exordos.push.yaml' EXIT
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos --no-check-updates push -c exordos/exordos.push.yaml -t local -f --latest
      - uses: actions/upload-artifact@v7
        with:
          name: metronom-${{ steps.build.outputs.version }}
          path: output/
          if-no-files-found: error
